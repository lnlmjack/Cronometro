<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Relógio</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            height: var(--app-height, 100vh);
            padding-top: env(safe-area-inset-top, 0px);
        }

        .display-container {
            flex: 0 0 auto;
            margin-top: 10vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .timer-display {
            font-size: clamp(56px, 22vw, 104px);
            font-weight: 100;
            font-variant-numeric: tabular-nums;
            letter-spacing: -1px;
            line-height: 1;
            color: #ffffff;
            text-align: center;
            width: 100%;
        }

        .controls-wrapper {
            flex: 0 0 auto;
            margin-top: 6vh;
            padding: 0 20px;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 22px;
            border-bottom: 0.5px solid #1c1c1e;
        }
        .btn {
            width: clamp(70px, 21vw, 88px);
            height: clamp(70px, 21vw, 88px);
            border-radius: 50%;
            border: none;
            font-size: 1.05rem;
            font-weight: 400;
            letter-spacing: -0.2px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
        }
        .btn:active {
            filter: brightness(1.35);
        }
        .btn-left {
            background-color: #2c2c2e;
            color: #ffffff;
        }
        .btn-left.disabled {
            background-color: #1c1c1e;
            color: #98989f;
        }
        .btn-right.start {
            background-color: #0a2912;
            color: #30d158;
        }
        .btn-right.stop {
            background-color: #330d0b;
            color: #ff453a;
        }

        .laps-area {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            padding: 0 20px;
        }
        .lap-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 0.5px solid #1c1c1e;
            font-size: 1.05rem;
            font-variant-numeric: tabular-nums;
            color: #ffffff;
        }

        .bottom-nav-container {
            flex: 0 0 auto;
            padding: 0 20px calc(env(safe-area-inset-bottom, 0px) + 8px) 20px;
        }
        .bottom-nav {
            background: linear-gradient(180deg, #242427 0%, #151517 100%);
            border-radius: 46px;
            padding: 4px;
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: inset 0 1px 0.5px rgba(255, 255, 255, 0.2);
            border: 0.5px solid #2c2c30;
        }
        .nav-item {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 40px;
            color: #e5e5ea;
            font-size: 0.65rem;
            font-weight: 500;
            letter-spacing: -0.1px;
            gap: 2px;
            cursor: pointer;
        }
        .nav-item.active {
            background-color: #08080a;
            color: #ff9f0a;
        }
        .nav-icon {
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .secret-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .secret-box {
            background: #1c1c1e;
            border: 1px solid #38383a;
            border-radius: 18px;
            padding: 22px;
            width: 100%;
            max-width: 320px;
            color: #fff;
        }
        .secret-box h3 {
            margin: 0 0 16px 0;
            font-size: 1.15rem;
            text-align: center;
            color: #ff9f0a;
        }
        .secret-box label {
            display: block;
            font-size: 0.85rem;
            color: #aeaeb2;
            margin-bottom: 6px;
        }
        .secret-box select, .secret-box input {
            width: 100%;
            padding: 11px;
            margin-bottom: 16px;
            background: #2c2c2e;
            border: 1px solid #3a3a3c;
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
        }
        .secret-actions {
            display: flex;
            gap: 10px;
        }
        .secret-actions button {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-save {
            background: #ff9f0a;
            color: #000;
        }
        .btn-cancel {
            background: #3a3a3c;
            color: #fff;
        }

        .version-tag {
            position: fixed;
            top: calc(env(safe-area-inset-top, 0px) + 4px);
            right: 8px;
            font-size: 9px;
            color: #3a3a3a;
            opacity: 0.6;
            z-index: 1000;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="version-tag">v1.9</div>

    <div class="app-container">
        <div class="display-container" id="secretTriggerTop">
            <div class="timer-display" id="display">00:00,00</div>
        </div>

        <div class="controls-wrapper">
            <div class="controls">
                <button class="btn btn-left disabled" id="leftBtn">Volta</button>
                <button class="btn btn-right start" id="rightBtn">Iniciar</button>
            </div>
        </div>

        <div class="laps-area" id="lapsArea"></div>

        <div class="bottom-nav-container">
            <div class="bottom-nav">
                <div class="nav-item">
                    <div class="nav-icon">
                        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.6">
                            <circle cx="12" cy="12" r="9.5"/>
                            <ellipse cx="12" cy="12" rx="4.8" ry="9.5"/>
                            <line x1="2.5" y1="12" x2="21.5" y2="12"/>
                            <path d="M4.2 7.2C7 8.4 17 8.4 19.8 7.2"/>
                            <path d="M4.2 16.8C7 15.6 17 15.6 19.8 16.8"/>
                            <line x1="12" y1="2.5" x2="12" y2="21.5"/>
                        </svg>
                    </div>
                    <span>Relógio</span>
                </div>

                <div class="nav-item">
                    <div class="nav-icon">
                        <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
                            <path d="M3.2 6.4L6.8 3.0" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
                            <path d="M20.8 6.4L17.2 3.0" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
                            <circle cx="12" cy="12.8" r="8.5" fill="#ffffff"/>
                            <path d="M12 7.8V12.8H8.6" stroke="#18181a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M7.2 19.8L5.6 21.6" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
                            <path d="M16.8 19.8L18.4 21.6" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <span>Alarmes</span>
                </div>

                <div class="nav-item active" id="secretTriggerBottom">
                    <div class="nav-icon">
                        <svg width="27" height="27" viewBox="0 0 24 24" fill="none">
                            <rect x="10.6" y="1.2" width="2.8" height="2.6" rx="0.8" fill="#ff9f0a"/>
                            <path d="M17.2 6.0L19.2 4.0" stroke="#ff9f0a" stroke-width="2.4" stroke-linecap="round"/>
                            <circle cx="12" cy="13.2" r="8.6" fill="#ff9f0a"/>
                            <circle cx="12" cy="13.2" r="1.5" fill="#08080a"/>
                            <path d="M12 13.2V7.2" stroke="#08080a" stroke-width="2.1" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <span>Cronômetro</span>
                </div>

                <div class="nav-item">
                    <div class="nav-icon">
                        <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
                            <path d="M12 2.8V6.2" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round"/>
                            <path d="M12 2.8 A 9.2 9.2 0 1 1 5.0 6.0" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round"/>
                            <path d="M12 12L8.2 8.4" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round"/>
                            <circle cx="12" cy="12" r="1.6" fill="#ffffff"/>
                        </svg>
                    </div>
                    <span>Timers</span>
                </div>
            </div>
        </div>
    </div>

    <div class="secret-modal" id="secretModal">
        <div class="secret-box">
            <h3>Configuração Secreta</h3>
            <label for="forceMode">Tipo de Forçagem:</label>
            <select id="forceMode">
                <option value="multiple">Múltiplo de (Ex: 9 -> 9, 18, 27)</option>
                <option value="exact">Soma Exata (Ex: sempre 15)</option>
                <option value="off">Desativado (Cronômetro Normal)</option>
            </select>

            <label for="forceValue">Número Alvo:</label>
            <input type="number" id="forceValue" min="1" max="50" value="9">

            <div class="secret-actions">
                <button class="btn-cancel" id="cancelSecret">Fechar</button>
                <button class="btn-save" id="saveSecret">Salvar</button>
            </div>
        </div>
    </div>

    <script>
        function setAppHeight() {
            document.documentElement.style.setProperty('--app-height', window.innerHeight + 'px');
        }
        setAppHeight();
        window.addEventListener('resize', setAppHeight);
        window.addEventListener('orientationchange', setAppHeight);

        let forceMode = localStorage.getItem('magic_mode') || 'multiple';
        let targetValue = parseInt(localStorage.getItem('magic_target') || '9', 10);
        if (isNaN(targetValue) || targetValue <= 0) {
            targetValue = 9;
        }

        let startTime = 0;
        let elapsedTime = 0;
        let lastLapTime = 0;
        let timerInterval = null;
        let isRunning = false;
        let lapCount = 0;

        const display = document.getElementById('display');
        const leftBtn = document.getElementById('leftBtn');
        const rightBtn = document.getElementById('rightBtn');
        const lapsArea = document.getElementById('lapsArea');

        function sumDigits(n) {
            const s = String(n);
            let sum = 0;
            for (let i = 0; i < s.length; i++) {
                sum += s.charCodeAt(i) - 48;
            }
            return sum;
        }

        function formatTime(ms) {
            const minutes = Math.floor(ms / 60000);
            const seconds = Math.floor((ms % 60000) / 1000);
            const centiseconds = Math.floor((ms % 1000) / 10);
            return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')},${String(centiseconds).padStart(2, '0')}`;
        }

        function getForcedTimeString(ms) {
            if (forceMode === 'off' || !targetValue || targetValue <= 0) {
                return formatTime(ms);
            }

            const actualMinutes = Math.floor(ms / 60000);
            const actualSeconds = Math.floor((ms % 60000) / 1000);
            const actualCs = Math.floor((ms % 1000) / 10);
            const actualTotalCs = actualMinutes * 6000 + actualSeconds * 100 + actualCs;

            let bestTotalCs = null;
            let minDiff = Infinity;

            for (let mm = 0; mm < 60; mm++) {
                const mmSum = sumDigits(mm);
                for (let ss = 0; ss < 60; ss++) {
                    const ssSum = sumDigits(ss);
                    const partialSum = mmSum + ssSum;
                    for (let cs = 0; cs < 100; cs++) {
                        const totalSum = partialSum + sumDigits(cs);

                        let isMatch = false;
                        if (forceMode === 'exact') {
                            isMatch = (totalSum === targetValue);
                        } else if (forceMode === 'multiple') {
                            isMatch = (totalSum > 0 && totalSum % targetValue === 0);
                        }

                        if (isMatch) {
                            const totalCs = mm * 6000 + ss * 100 + cs;
                            const diff = Math.abs(totalCs - actualTotalCs);
                            if (diff < minDiff) {
                                minDiff = diff;
                                bestTotalCs = totalCs;
                            }
                        }
                    }
                }
            }

            if (bestTotalCs === null) {
                return formatTime(ms);
            }

            const bm = Math.floor(bestTotalCs / 6000);
            const bs = Math.floor((bestTotalCs % 6000) / 100);
            const bc = bestTotalCs % 100;
            return `${String(bm).padStart(2, '0')}:${String(bs).padStart(2, '0')},${String(bc).padStart(2, '0')}`;
        }

        rightBtn.addEventListener('click', () => {
            if (!isRunning) {
                isRunning = true;
                startTime = Date.now() - elapsedTime;
                timerInterval = setInterval(() => {
                    elapsedTime = Date.now() - startTime;
                    display.textContent = formatTime(elapsedTime);
                }, 16);

                rightBtn.className = 'btn btn-right stop';
                rightBtn.textContent = 'Parar';
                leftBtn.className = 'btn btn-left';
                leftBtn.textContent = 'Volta';
            } else {
                clearInterval(timerInterval);
                isRunning = false;
                elapsedTime = Date.now() - startTime;

                const finalStr = getForcedTimeString(elapsedTime);
                display.textContent = finalStr;

                rightBtn.className = 'btn btn-right start';
                rightBtn.textContent = 'Iniciar';
                leftBtn.className = 'btn btn-left';
                leftBtn.textContent = 'Volta';
            }
        });

        leftBtn.addEventListener('click', () => {
            if (isRunning) {
                lapCount++;
                const lapTime = elapsedTime - lastLapTime;
                lastLapTime = elapsedTime;
                const row = document.createElement('div');
                row.className = 'lap-row';
                row.innerHTML = `<span>Volta ${lapCount}</span><span>${formatTime(lapTime)}</span>`;
                lapsArea.prepend(row);
            } else if (elapsedTime > 0) {
                elapsedTime = 0;
                lastLapTime = 0;
                lapCount = 0;
                display.textContent = '00:00,00';
                lapsArea.innerHTML = '';
                leftBtn.className = 'btn btn-left disabled';
                leftBtn.textContent = 'Volta';
            }
        });

        const modal = document.getElementById('secretModal');
        const modeSelect = document.getElementById('forceMode');
        const valueInput = document.getElementById('forceValue');

        function setupSecretTrigger(element) {
            let taps = 0;
            let timer = null;
            element.addEventListener('click', () => {
                taps++;
                clearTimeout(timer);
                if (taps === 3) {
                    taps = 0;
                    modeSelect.value = forceMode;
                    valueInput.value = targetValue;
                    modal.style.display = 'flex';
                } else {
                    timer = setTimeout(() => { taps = 0; }, 450);
                }
            });
        }

        setupSecretTrigger(document.getElementById('secretTriggerBottom'));
        setupSecretTrigger(document.getElementById('secretTriggerTop'));

        document.getElementById('saveSecret').addEventListener('click', () => {
            forceMode = modeSelect.value;
            const rawVal = String(valueInput.value).trim();
            const val = Number(rawVal);
            if (!isNaN(val) && val > 0) {
                targetValue = Math.floor(val);
            }
            localStorage.setItem('magic_mode', forceMode);
            localStorage.setItem('magic_target', String(targetValue));
            modal.style.display = 'none';
        });

        document.getElementById('cancelSecret').addEventListener('click', () => {
            modal.style.display = 'none';
        });
    </script>
</body>
</html>
