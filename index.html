<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Relógio</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100dvh;
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Área do Mostrador Principal */
        .display-container {
            height: 41dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: 4dvh;
            width: 100%;
        }
        .timer-display {
            font-size: clamp(4.5rem, 20.5vw, 5.8rem);
            font-weight: 200;
            font-variant-numeric: tabular-nums;
            letter-spacing: -2px;
            line-height: 1;
            color: #ffffff;
            text-align: center;
        }

        /* Área dos Botões (Volta / Iniciar) */
        .controls-wrapper {
            width: 100%;
            max-width: 430px;
            margin: 0 auto;
            padding: 0 16px;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 18px;
            border-bottom: 1px solid #161618;
        }
        .btn {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            border: none;
            font-size: 1.05rem;
            font-weight: 400;
            letter-spacing: -0.2px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
        }
        .btn:active {
            filter: brightness(1.35);
        }
        .btn-left {
            background-color: #2c2c2e;
            color: #ffffff;
        }
        .btn-left.disabled {
            background-color: #1c1c1e;
            color: #98989f;
        }
        .btn-right.start {
            background-color: #0a2912;
            color: #30d158;
        }
        .btn-right.stop {
            background-color: #330d0b;
            color: #ff453a;
        }

        /* Pontinhos Centrais */
        .dots {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: center;
        }
        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: #454549;
        }
        .dot.active {
            background-color: #ffffff;
        }

        /* Lista de Voltas */
        .laps-area {
            flex: 1;
            width: 100%;
            max-width: 430px;
            margin: 0 auto;
            padding: 0 16px;
            overflow-y: auto;
        }
        .lap-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #161618;
            font-size: 1.05rem;
            font-variant-numeric: tabular-nums;
            color: #ffffff;
        }

        /* Barra Inferior Estilo Pílula iOS (Bem no fundo e maior) */
        .bottom-nav-container {
            width: 100%;
            max-width: 430px;
            margin: 0 auto;
            padding: 0 18px 8px 18px;
        }
        .bottom-nav {
            background: linear-gradient(180deg, #1d1d20 0%, #141416 100%);
            border-radius: 42px;
            padding: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: inset 0 1px 0.5px rgba(255, 255, 255, 0.14);
            border: 0.5px solid #28282c;
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px 0 5px 0;
            border-radius: 36px;
            color: #e5e5ea;
            font-size: 0.68rem;
            font-weight: 500;
            letter-spacing: -0.1px;
            gap: 3px;
            cursor: pointer;
        }
        .nav-item.active {
            background-color: #070708;
            color: #ff9f0a;
        }
        .nav-icon {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Janela Secreta de Configuração */
        .secret-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .secret-box {
            background: #1c1c1e;
            border: 1px solid #38383a;
            border-radius: 18px;
            padding: 22px;
            width: 100%;
            max-width: 320px;
            color: #fff;
        }
        .secret-box h3 {
            margin: 0 0 16px 0;
            font-size: 1.15rem;
            text-align: center;
            color: #ff9f0a;
        }
        .secret-box label {
            display: block;
            font-size: 0.85rem;
            color: #aeaeb2;
            margin-bottom: 6px;
        }
        .secret-box select, .secret-box input {
            width: 100%;
            padding: 11px;
            margin-bottom: 16px;
            background: #2c2c2e;
            border: 1px solid #3a3a3c;
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
        }
        .secret-actions {
            display: flex;
            gap: 10px;
        }
        .secret-actions button {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-save {
            background: #ff9f0a;
            color: #000;
        }
        .btn-cancel {
            background: #3a3a3c;
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- Mostrador (3 toques rápidos aqui também abrem o menu secreto) -->
    <div class="display-container" id="secretTriggerTop">
        <div class="timer-display" id="display">00:00,00</div>
    </div>

    <!-- Botões e Linha Divisória -->
    <div class="controls-wrapper">
        <div class="controls">
            <button class="btn btn-left disabled" id="leftBtn">Volta</button>
            <div class="dots">
                <div class="dot active"></div>
                <div class="dot"></div>
            </div>
            <button class="btn btn-right start" id="rightBtn">Iniciar</button>
        </div>
    </div>

    <!-- Espaço das Voltas -->
    <div class="laps-area" id="lapsArea"></div>

    <!-- Barra Inferior Fiel ao iOS -->
    <div class="bottom-nav-container">
        <div class="bottom-nav">
            <!-- Relógio (Globo) -->
            <div class="nav-item">
                <div class="nav-icon">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.7">
                        <circle cx="12" cy="12" r="9.2"/>
                        <ellipse cx="12" cy="12" rx="4.6" ry="9.2"/>
                        <line x1="2.8" y1="12" x2="21.2" y2="12"/>
                        <path d="M4.2 7.2h15.6"/>
                        <path d="M4.2 16.8h15.6"/>
                        <line x1="12" y1="2.8" x2="12" y2="21.2"/>
                    </svg>
                </div>
                <span>Relógio</span>
            </div>

            <!-- Alarmes (Despertador Preenchido) -->
            <div class="nav-item">
                <div class="nav-icon">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
                        <path d="M3.2 6.8L6.8 3.2" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round"/>
                        <path d="M20.8 6.8L17.2 3.2" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round"/>
                        <circle cx="12" cy="13" r="8.2" fill="#ffffff"/>
                        <path d="M12 8.2V13L9.2 14.8" stroke="#151517" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <span>Alarmes</span>
            </div>

            <!-- Cronômetro (Sólido Laranja - 3 toques abrem o menu secreto) -->
            <div class="nav-item active" id="secretTriggerBottom">
                <div class="nav-icon">
                    <svg width="27" height="27" viewBox="0 0 24 24" fill="none">
                        <!-- Pino superior -->
                        <rect x="10.8" y="1.6" width="2.4" height="2.6" rx="0.8" fill="#ff9f0a"/>
                        <!-- Botão lateral direito -->
                        <path d="M17.2 6.2L19.1 4.3" stroke="#ff9f0a" stroke-width="2.3" stroke-linecap="round"/>
                        <!-- Corpo sólido laranja -->
                        <circle cx="12" cy="13.2" r="8.4" fill="#ff9f0a"/>
                        <!-- Ponteiro apontando para ~10h e centro -->
                        <circle cx="12" cy="13.2" r="1.4" fill="#070708"/>
                        <path d="M12 13.2L8.3 9.8" stroke="#070708" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </div>
                <span>Cronômetro</span>
            </div>

            <!-- Timers (Arco aberto com ponteiro às 10h) -->
            <div class="nav-item">
                <div class="nav-icon">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
                        <path d="M12 3.3V6.3" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round"/>
                        <path d="M12 3.3 A 8.7 8.7 0 1 1 5.4 6.3" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round"/>
                        <path d="M12 12L8.4 8.8" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round"/>
                        <circle cx="12" cy="12" r="1.4" fill="#ffffff"/>
                    </svg>
                </div>
                <span>Timers</span>
            </div>
        </div>
    </div>

    <!-- Janela Secreta de Configuração -->
    <div class="secret-modal" id="secretModal">
        <div class="secret-box">
            <h3>Configuração Secreta</h3>
            <label for="forceMode">Tipo de Forçagem:</label>
            <select id="forceMode">
                <option value="multiple">Múltiplo de (Ex: 9 -> 9, 18, 27)</option>
                <option value="exact">Soma Exata (Ex: sempre 15)</option>
                <option value="off">Desativado (Cronômetro Normal)</option>
            </select>

            <label for="forceValue">Número Alvo:</label>
            <input type="number" id="forceValue" min="1" max="50" value="9">

            <div class="secret-actions">
                <button class="btn-cancel" id="cancelSecret">Fechar</button>
                <button class="btn-save" id="saveSecret">Salvar</button>
            </div>
        </div>
    </div>

    <script>
        let forceMode = localStorage.getItem('magic_mode') || 'multiple';
        let targetValue = parseInt(localStorage.getItem('magic_target') || '9', 10);

        let startTime = 0;
        let elapsedTime = 0;
        let lastLapTime = 0;
        let timerInterval = null;
        let isRunning = false;
        let lapCount = 0;

        const display = document.getElementById('display');
        const leftBtn = document.getElementById('leftBtn');
        const rightBtn = document.getElementById('rightBtn');
        const lapsArea = document.getElementById('lapsArea');

        function sumDigits(str) {
            let sum = 0;
            for (let ch of str) {
                if (ch >= '0' && ch <= '9') sum += parseInt(ch, 10);
            }
            return sum;
        }

        function formatTime(ms) {
            const minutes = Math.floor(ms / 60000);
            const seconds = Math.floor((ms % 60000) / 1000);
            const centiseconds = Math.floor((ms % 1000) / 10);
            return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')},${String(centiseconds).padStart(2, '0')}`;
        }

        function getForcedTimeString(ms) {
            if (forceMode === 'off' || targetValue <= 0) {
                return formatTime(ms);
            }

            const minutes = Math.floor(ms / 60000);
            const seconds = Math.floor((ms % 60000) / 1000);
            const actualCs = Math.floor((ms % 1000) / 10);

            const minSecStr = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            const baseSum = sumDigits(minSecStr);

            let bestCs = actualCs;
            let minDiff = 999;

            for (let cs = 0; cs < 100; cs++) {
                let csStr = String(cs).padStart(2, '0');
                let totalSum = baseSum + sumDigits(csStr);

                let isMatch = false;
                if (forceMode === 'exact') {
                    isMatch = (totalSum === targetValue);
                } else if (forceMode === 'multiple') {
                    isMatch = (totalSum > 0 && totalSum % targetValue === 0);
                }

                if (isMatch) {
                    let diff = Math.abs(cs - actualCs);
                    if (diff < minDiff) {
                        minDiff = diff;
                        bestCs = cs;
                    }
                }
            }

            if (minDiff === 999) {
                for (let cs = 0; cs < 100; cs++) {
                    let csStr = String(cs).padStart(2, '0');
                    let totalSum = baseSum + sumDigits(csStr);
                    if (totalSum > 0 && totalSum % targetValue === 0) {
                        let diff = Math.abs(cs - actualCs);
                        if (diff < minDiff) {
                            minDiff = diff;
                            bestCs = cs;
                        }
                    }
                }
            }

            return `${minSecStr},${String(bestCs).padStart(2, '0')}`;
        }

        rightBtn.addEventListener('click', () => {
            if (!isRunning) {
                isRunning = true;
                startTime = Date.now() - elapsedTime;
                timerInterval = setInterval(() => {
                    elapsedTime = Date.now() - startTime;
                    display.textContent = formatTime(elapsedTime);
                }, 16);

                rightBtn.className = 'btn btn-right stop';
                rightBtn.textContent = 'Parar';
                leftBtn.className = 'btn btn-left';
                leftBtn.textContent = 'Volta';
            } else {
                clearInterval(timerInterval);
                isRunning = false;
                elapsedTime = Date.now() - startTime;

                const finalStr = getForcedTimeString(elapsedTime);
                display.textContent = finalStr;

                rightBtn.className = 'btn btn-right start';
                rightBtn.textContent = 'Iniciar';
                leftBtn.className = 'btn btn-left';
                leftBtn.textContent = 'Zerar';
            }
        });

        leftBtn.addEventListener('click', () => {
            if (isRunning) {
                lapCount++;
                const lapTime = elapsedTime - lastLapTime;
                lastLapTime = elapsedTime;
                const row = document.createElement('div');
                row.className = 'lap-row';
                row.innerHTML = `<span>Volta ${lapCount}</span><span>${formatTime(lapTime)}</span>`;
                lapsArea.prepend(row);
            } else if (elapsedTime > 0) {
                elapsedTime = 0;
                lastLapTime = 0;
                lapCount = 0;
                display.textContent = '00:00,00';
                lapsArea.innerHTML = '';
                leftBtn.className = 'btn btn-left disabled';
                leftBtn.textContent = 'Volta';
            }
        });

        // Menu Secreto: 3 toques no ícone Cronômetro ou nos números
        const modal = document.getElementById('secretModal');
        const modeSelect = document.getElementById('forceMode');
        const valueInput = document.getElementById('forceValue');

        function setupSecretTrigger(element) {
            let taps = 0;
            let timer = null;
            element.addEventListener('click', () => {
                taps++;
                clearTimeout(timer);
                if (taps === 3) {
                    taps = 0;
                    modeSelect.value = forceMode;
                    valueInput.value = targetValue;
                    modal.style.display = 'flex';
                } else {
                    timer = setTimeout(() => { taps = 0; }, 450);
                }
            });
        }

        setupSecretTrigger(document.getElementById('secretTriggerBottom'));
        setupSecretTrigger(document.getElementById('secretTriggerTop'));

        document.getElementById('saveSecret').addEventListener('click', () => {
            forceMode = modeSelect.value;
            const val = parseInt(valueInput.value, 10);
            if (!isNaN(val) && val > 0) {
                targetValue = val;
            }
            localStorage.setItem('magic_mode', forceMode);
            localStorage.setItem('magic_target', targetValue);
            modal.style.display = 'none';
        });

        document.getElementById('cancelSecret').addEventListener('click', () => {
            modal.style.display = 'none';
        });
    </script>
</body>
</html>
